[workspace]
resolver = "2"
members = [
    "core",
    "cli",
    "hacks",
    "rate-limits",
    "creds",
    "graphql",
    "graphql-ctid",
    "graphql-xpff",
    "graphql-creds",
    "birdwatch",
]
default-members = [
    "core",
    "cli",
    "rate-limits",
    "creds",
    "graphql",
    "graphql-ctid",
    "graphql-xpff",
    "graphql-creds",
    "birdwatch",
]

[workspace.package]
authors = ["Travis Brown <travisrobertbrown@gmail.com>"]
homepage = "https://github.com/travisbrown/birdsite"
repository = "https://github.com/travisbrown/birdsite"
keywords = ["twitter"]
edition = "2024"
license = "AGPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
archivindex-wbm-cdx-index = { git = "https://github.com/travisbrown/archivindex.git" }
archivindex-wbm-json = { git = "https://github.com/travisbrown/archivindex.git" }
bounded-static = "0.8"
bounded-static-derive-more = "0.1"
chrono = { version = "0.4", features = ["serde"] }
num-rational = "0.4"
proptest = "1"
rand = "0.10"
regex = "1"
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
serde-field-attributes = "0.7"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tempfile = "3"
test-strategy = "0.4"
thiserror = "2"
url = { version = "2", features = ["serde"] }

# Use the local archivindex checkout until its pack/enhance/check operations are pushed; remove this
# section once they are.
[patch."https://github.com/travisbrown/archivindex.git"]
archivindex-wbm = { path = "../archivindex/wbm" }
archivindex-wbm-cdx-index = { path = "../archivindex/wbm-cdx-index" }
archivindex-wbm-json = { path = "../archivindex/wbm-json" }
