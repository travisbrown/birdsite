[package]
name = "birdsite-cli"
description = "CLI for processing Wayback Machine Twitter snapshot data"
authors.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
archivindex-wbm-cdx-index = { workspace = true }
archivindex-wbm-json = { workspace = true }
archivindex-wbm-json-processing = { workspace = true }
birdsite = { path = "../core" }
cli-helpers = "0.1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Must stay version-compatible with the `sha1` used by `archivindex-wbm-json`, since its hasher is
# passed to `Context::verify`.
sha1 = "0.11"
thiserror = { workspace = true }
toml = "1"
zstd = "0.13"
