[package]
name = "birdsite-graphql-creds"
description = "SQLite-backed credential and transaction ID storage for the X (Twitter) GraphQL API"
authors = { workspace = true }
repository = { workspace = true }
version = { workspace = true }
edition.workspace = true
rust-version.workspace = true
license = { workspace = true }
keywords = { workspace = true }
readme = "../README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Build SQLite from source on platforms without a system installation.
bundled = ["rusqlite/bundled"]

[lints]
workspace = true

[dependencies]
birdsite-graphql-ctid = { path = "../graphql-ctid/", version = "0.1.0" }
chrono = { workspace = true }
rusqlite = "0.40"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1", features = ["macros"] }
