[package]
name = "birdsite-graphql-ctid"
description = "Client transaction ID generation for the X (Twitter) GraphQL API"
authors = { workspace = true }
repository = { workspace = true }
version = { workspace = true }
edition.workspace = true
rust-version.workspace = true
license = { workspace = true }
keywords = { workspace = true }
# Fixtures under `tests/` bundle real captured API responses; they are not needed to build or use the
# crate, so keep them out of the published tarball.
exclude = ["tests/"]
readme = "../README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
base64 = "0.23"
chrono = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
scraper = "0.29"
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
