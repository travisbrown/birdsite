[graph]
all-features = true

[advisories]
version = 2

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The CLI and experiments use unpublished workspace packages.
allow-wildcard-paths = true

[licenses]
version = 2
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-only",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Shared archive and test-support crates are consumed from their public repositories.
allow-git = [
  "https://github.com/travisbrown/archivindex",
  "https://github.com/travisbrown/archivindex-wbm",
]
