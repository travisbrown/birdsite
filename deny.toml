[graph]
all-features = true

[advisories]
version = 2

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The CLI and experiments use unpublished workspace packages.
allow-wildcard-paths = true

[licenses]
version = 2
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-only",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# cli-helpers ships the Anti-Capitalist Software License 1.4 as a license file.
# It has no SPDX identifier, so identify the existing license by its exact file hash.
[[licenses.clarify]]
crate = "cli-helpers@0.1.0"
expression = "LicenseRef-ACSL-1.4"
license-files = [{ path = "LICENSE", hash = 0x4c560e9f }]

[[licenses.exceptions]]
crate = "cli-helpers@0.1.0"
allow = ["LicenseRef-ACSL-1.4"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Shared archive and test-support crates are consumed from their public repositories.
allow-git = [
  "https://github.com/travisbrown/archivindex",
  "https://github.com/travisbrown/archivindex-wbm",
]
