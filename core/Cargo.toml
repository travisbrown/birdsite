[package]
name = "birdsite"
description = "Data models for working with X (Twitter) data"
authors = { workspace = true }
repository = { workspace = true }
version = { workspace = true }
edition.workspace = true
rust-version.workspace = true
license = { workspace = true }
keywords = { workspace = true }
# Fixtures under `tests/` bundle real captured API responses; they are not needed to build or use the
# crate, so keep them out of the published tarball.
exclude = ["tests/"]
readme = "../README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
bounded-static = { workspace = true }
bounded-static-derive-more = { workspace = true }
chrono = { workspace = true }
num-rational = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-field-attributes = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[dev-dependencies]
archivindex-wbm-test-data = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
test-strategy = { workspace = true }
tokio = { workspace = true }
